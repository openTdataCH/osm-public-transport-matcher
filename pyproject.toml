[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-public-transport-matcher"
version = "0.1.0"
description = "Independent public transport stop and route matching against OpenStreetMap"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gtfs = ["pandas>=2.0"]
swiss = ["pandas>=2.0", "duckdb>=1.4,<2", "requests>=2.31", "shapely>=2.0"]
acquisition = ["pandas>=2.0", "duckdb>=1.4,<2", "requests>=2.31", "shapely>=2.0"]
test = ["pytest>=8,<9", "hypothesis>=6,<7"]
quality = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1", "hypothesis>=6,<7", "jsonschema>=4,<5", "vulture>=2.14,<3"]
mutation = ["mutmut>=3.8,<4"]

[project.scripts]
osm-public-transport-matcher = "osm_public_transport_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/osm_public_transport_matcher"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/osm_public_transport_matcher/results/validation.py"]
pytest_add_cli_args_test_selection = ["tests/test_results.py", "tests/test_quality_properties.py"]
