name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install '.[swiss,gtfs,acquisition,test]'
      - run: python -m pytest tests -q
      - name: Verify the installed package runs outside the checkout
        working-directory: /tmp
        run: >-
          python -c 'from transport_matcher import SourceStop, OsmNode, match;
          assert match([SourceStop("demo", "1", 51.5, -0.1, name="A")],
          [OsmNode("1", 51.5, -0.1, name="A")]).matched'

