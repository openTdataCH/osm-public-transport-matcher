<title id="result-bundle-anatomy-title">Anatomy of a result bundle</title>
<desc id="result-bundle-anatomy-desc">A result bundle is a directory with manifest.json and nine gzip-compressed JSON Lines files. The manifest records the schema version, engine version, run id, profile and metadata, and the row count, size and SHA-256 checksum of every file. The files hold entities (source stops, OSM nodes, groups), decisions (matches, unmatched entities, problems) and details (routes, extensions, diagnostics). Rows refer to entities by their keys.</desc>
