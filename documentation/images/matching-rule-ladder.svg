<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 960 622" width="960" height="622" role="img" aria-labelledby="matching-rule-ladder-title matching-rule-ladder-desc">
<title id="matching-rule-ladder-title">The matching rules, in order</title>
<desc id="matching-rule-ladder-desc">Before the rules run, OSM nodes are grouped into pairs and trios. Ten rule executions then run in a fixed order: trio, exact reference, name, route, group proximity at 50 m and 150 m, local reference, single nearest candidate, ratio test and a second single-candidate pass. Each rule only sees source stops that are still unmatched, and every accepted pair is committed immediately, which locks both sides. Stops left at the end are unmatched and go to problem detection.</desc>
