<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 71 960 465" width="960" height="465" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Inside the matching engine</title>
<desc id="diagram-desc">The engine has three parts. Input integrations are dataset-specific: optional acquisition downloads files, format adapters parse them into normalized records, and dataset profiles hold the matching policy. The source-neutral core matches stops, detects problems, compares routes and computes quality metrics without any file, network or database access. Result production validates the complete result and atomically publishes the bundle.</desc>
