<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 71 960 552" width="960" height="552" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">The route model</title>
<desc id="diagram-desc">Both sides are normalized into the same three levels: a line family, its itineraries (one per direction or variant) and each itinerary's ordered stop calls. On the ATLAS side these are rebuilt from GTFS; on the OSM side they come from route_master and route relations. Families are matched first, by GTFS route id. Itineraries are paired only inside a matched family: their directions must agree and at least 80 percent of the longer stop list must be shared in order. In the example, four of five stops align, which is exactly 80 percent.</desc>
